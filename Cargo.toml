[package]
name = "filter-skimverify"
version = "0.1.0"
edition = "2021"
description = "OpenSMTPD filter for DKIM signature verification and SPF alignment checking"

[dependencies]
opensmtpd-filter = { git = "https://github.com/KrugerHeavyIndustries/opensmtpd-filter_rs" }
mail-auth = "0.12.1"
tokio = { version = "1", features = ["rt", "net"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
